<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-mark">{{ site.Params.initials }}</span>
      <span class="brand-name">{{ site.Title }}</span>
    </a>

    <nav class="nav">
      {{ $cur := .RelPermalink }}
      {{ range site.Menus.main }}
        {{ $u := .URL }}
        {{ $active := or (eq $cur $u) (and (ne $u "/") (hasPrefix $cur $u)) }}
        <a href="{{ $u | relURL }}"{{ if $active }} class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>

    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换深浅色主题" title="切换深浅色主题">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </div>
</header>
