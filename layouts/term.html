{{ define "main" }}
<div class="container">
  <header class="page-header">
    <h1 class="page-title">标签：{{ .Title }}</h1>
    <p class="page-desc">共 {{ len .Pages }} 篇文章</p>
  </header>

  {{ if .Pages }}
    <div class="post-list">
      {{ range .Pages }}{{ partial "post-card.html" . }}{{ end }}
    </div>
  {{ else }}
    <p class="empty">这个标签下还没有文章。</p>
  {{ end }}

  <p style="padding-bottom:56px"><a href="{{ "tags/" | relURL }}">← 返回全部标签</a></p>
</div>
{{ end }}
