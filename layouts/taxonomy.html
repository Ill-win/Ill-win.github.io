{{ define "main" }}
<div class="container">
  <header class="page-header">
    <h1 class="page-title">标签</h1>
    <p class="page-desc">共 {{ len .Pages }} 个标签。点进去看相关文章。</p>
  </header>

  <div class="tag-cloud">
    {{ range .Pages }}
      <a class="tag-cloud-item" href="{{ .RelPermalink }}">
        {{ .LinkTitle }}
        <span class="count">{{ len .Pages }}</span>
      </a>
    {{ end }}
  </div>
</div>
{{ end }}
