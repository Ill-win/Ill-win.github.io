{{ define "main" }}
<div class="container">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Description }}<p class="page-desc">{{ . }}</p>{{ end }}
  </header>

  {{ $pag := .Paginate .RegularPages }}
  {{ if $pag.Pages }}
    <div class="post-list">
      {{ range $pag.Pages }}{{ partial "post-card.html" . }}{{ end }}
    </div>
    {{ partial "pagination.html" $pag }}
  {{ else }}
    <p class="empty">这里还没有文章。</p>
  {{ end }}
</div>
{{ end }}
